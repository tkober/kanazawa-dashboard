# Apps shown on the dashboard, in this order.
#
#   host         optional  the server address (hostname or IP, optionally with
#                          a port), substituted for {host} in url and health
#                          below. Set once here instead of repeating it.
#   name         required  tile title
#   url          required  where a click on the tile goes
#   health       optional  what the backend probes for the status indicator:
#                          a path (resolved against url), an absolute URL
#                          (e.g. an API on its own port), or omitted to probe
#                          url itself. Any HTTP answer < 400 counts as up.
#   description  optional  one line under the title
#   icon         optional  an emoji
#   group        optional  tiles with the same group are shown together
#   accent       optional  a CSS colour string (e.g. a hex code), used by
#                          clients for app-specific theming
#   id           optional  defaults to a slug of name
#
# The health checks run inside the dashboard backend container, so {host}
# must be reachable from there too (see README).

# One place for the server address: links and health checks all go through
# {host}. An IP rather than kanazawa.local, because mDNS names don't resolve
# over WireGuard or inside containers.
host: 192.168.2.230

title: Kanazawa

apps:
  - name: Trip Planner
    url: http://{host}:8080
    health: http://{host}:8001/health
    description: Reisen planen
    icon: 🗺️
    group: Tools

  - name: Footage Archive
    url: http://{host}:8082
    health: /api/version
    description: Video-Archiv durchsuchen und umbenennen
    icon: 🎞️
    group: Tools

  - name: Katakana Reading
    url: http://{host}:8083
    health: /api/health
    description: Practise reading katakana
    icon: ア
    group: Japanisch
    accent: "#c98a0b"

  - name: JP Conjugation
    url: http://{host}:8084
    health: /api/health
    description: Practise verb and adjective conjugation
    icon: 活
    group: Japanisch
    accent: "#6b4f96"

  - name: JP Conversation Practice
    url: http://{host}:8085
    health: /api/health
    description: Practise spoken conversation
    icon: 💬
    group: Japanisch
    accent: "#1f7a80"

  - name: Kanji Trainer
    url: http://{host}:8086
    health: /api/health
    description: Learn kanji with spaced repetition
    icon: 漢
    group: Japanisch
    accent: "#2b4c7e"

  - name: Anki MCP
    url: http://{host}:3141
    # AnkiConnect lives in the same container and answers plain GETs.
    health: http://{host}:8765
    description: Headless Anki mit MCP-Server
    icon: 🃏
    group: Japanisch

  - name: n8n
    url: http://{host}:5678
    health: /healthz
    description: Shisa AI Workflows
    icon: ⚙️
    group: Shisa AI

  - name: Shisa AI Core
    url: http://{host}:8000/docs
    health: http://{host}:8000/health
    description: Core-API (Swagger)
    icon: 🦁
    group: Shisa AI

  - name: Jellyfin
    url: http://{host}:8096
    health: /health
    description: Filme und Serien
    icon: 🎬
    group: Medien

  - name: Unraid
    url: http://{host}
    description: Server-Verwaltung
    icon: 🖥️
    group: Infrastruktur

  - name: Adminer
    url: http://{host}:8081
    description: Postgres-Datenbanken verwalten
    icon: 🐘
    group: Infrastruktur

  - name: Rclone
    url: http://{host}:5572
    description: Rclone Web-UI
    icon: ☁️
    group: Infrastruktur
