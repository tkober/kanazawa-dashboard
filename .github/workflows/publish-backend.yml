name: Build backend Docker image

on:
  push:
    branches: ["main"]
    paths:
      # config/apps.yaml is baked into the backend image
      - "backend/**"
      - "config/**"
      - ".github/workflows/publish-backend.yml"
    tags: ["v*.*.*"]
  # Manual rebuild, e.g. to republish without a code change.
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/tkober/kanazawa-dashboard-backend
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=sha

      - uses: docker/build-push-action@v6
        with:
          # Repo root: the Dockerfile copies config/ from outside backend/
          context: .
          file: ./backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
