server {
    # The listen port is substituted by nginx's envsubst-on-templates
    # entrypoint at startup (default 80, see the Dockerfile). $uri/$host below
    # survive it, since envsubst only replaces variables set in the
    # environment. It rewrites comments too, so this file avoids spelling out
    # the substituted variable names.
    listen ${PORT};
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Backend API, reverse-proxied so the SPA calls it same-origin from
    # whatever address the page was loaded from. No CORS, no published
    # backend port.
    location /api/ {
        # Docker's embedded DNS, resolved at request time, so recreating the
        # backend container (new IP) doesn't strand nginx on a stale address.
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $api_upstream ${API_UPSTREAM};
        proxy_pass http://$api_upstream;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
